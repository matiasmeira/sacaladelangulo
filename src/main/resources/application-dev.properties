# Overrides para desarrollo local. Se activa con SPRING_PROFILES_ACTIVE=dev
# (ya seteado en el .env local, cargado por el launch config de VSCode).
# No usar estos valores en un despliegue real: son verbosos a propósito.

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.web=DEBUG

# Sin Flyway/Liquibase todavía, "update" es la única forma práctica de mantener el
# esquema local al día. La config base (application.properties) usa "validate" a propósito.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
