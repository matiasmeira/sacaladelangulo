# Overrides para desarrollo local. Se activa con SPRING_PROFILES_ACTIVE=dev
# (ya seteado en el .env local, cargado por el launch config de VSCode).
# No usar estos valores en un despliegue real: son verbosos a propósito.

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.web=DEBUG

# Con Flyway a cargo del esquema (ver db/migration/V1__baseline.sql), "validate" también
# en dev: el esquema local se mantiene al día corriendo migraciones, no dejando que
# Hibernate autogenere DDL. Coincide con el default de la config base (application.properties).
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
