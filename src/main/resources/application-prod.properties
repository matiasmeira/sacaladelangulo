# =============================================================================
# Perfil de PRODUCCIÓN. Se activa con SPRING_PROFILES_ACTIVE=prod.
# El Dockerfile ya lo fija por defecto (ENV SPRING_PROFILES_ACTIVE=prod), así que
# la imagen arranca en este perfil aunque la plataforma no lo setee explícitamente.
#
# Hereda TODO de application.properties (config base, ya endurecida para un
# despliegue real: ddl-auto=validate, Flyway a cargo del esquema, actuator solo
# health/show-details=never, swagger off, show-sql off, secretos sin default).
# Acá SOLO se agrega/override lo específico de correr en un contenedor, detrás
# del proxy de la plataforma, contra un Postgres administrado. No se repite lo
# que ya está bien resuelto en la base.
# =============================================================================

# --- Binding / proxy ---------------------------------------------------------
# Railway/Render/Fly inyectan el puerto a escuchar en la env var PORT. Sin esto
# la app escucharía en 8080 fijo y el proxy de la plataforma no la alcanzaría.
server.port=${PORT:8080}
# Bindear a todas las interfaces para ser alcanzable desde el proxy del contenedor.
# Es el default de Spring Boot cuando server.address no se fija; se deja explícito.
server.address=0.0.0.0
# TLS lo termina la plataforma; detrás del proxy llegan los headers X-Forwarded-*.
# "framework" hace que Spring reconstruya scheme/host/puerto originales (https, el
# dominio real) para los links absolutos que se arman en los mails y para que las
# cookies Secure se emitan correctamente.
server.forward-headers-strategy=framework

# --- Apagado ordenado (graceful shutdown) ------------------------------------
# Deja terminar las requests en vuelo (y drenar el executor @Async) antes de matar
# el proceso cuando la plataforma manda SIGTERM en un redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Base de datos (Postgres administrado) -----------------------------------
# SSL obligatorio hacia la DB administrada (sslmode=require). DB_HOST y DB_NAME
# SIN default: si faltan, la app NO arranca (fail-fast) en vez de intentar pegarle
# a localhost. Alternativa para plataformas que dan una sola URL: setear la env
# var SPRING_DATASOURCE_URL con la JDBC URL completa (tiene mayor precedencia y
# reemplaza esta línea por completo, sin evaluar sus placeholders).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}

# HikariCP dimensionado para un tier chico de Postgres administrado, que suele
# tener un LÍMITE BAJO de conexiones (ej. ~20-25 en total). Con UNA instancia, 5
# conexiones dejan margen para migraciones y otras herramientas sin agotar el
# límite del plan. Regla: maximum-pool-size < (límite_del_plan / nº_instancias).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
# max-lifetime por debajo del idle-timeout típico de Postgres/pgbouncer para que
# Hikari recicle la conexión antes de que el server la corte.
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.keepalive-time=300000
# Espera/reintento de la conexión inicial: la DB administrada puede tardar en
# estar lista (cold start). Hikari reintenta obtener la primera conexión hasta
# 60s antes de abortar el arranque, en vez de fallar al primer intento.
spring.datasource.hikari.initialization-fail-timeout=60000

# Flyway también reintenta la conexión al arrancar (corre las migraciones durante
# el startup): tolera que la DB todavía no esté lista cuando levanta el contenedor.
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}
spring.flyway.connect-retries-interval=10

# --- Health / probes de plataforma -------------------------------------------
# Expone /actuator/health/liveness y /actuator/health/readiness para las probes.
# readiness incluye el chequeo de DB: la instancia se marca "no lista" (y deja de
# recibir tráfico) si perdió la base. La base ya limita actuator a solo "health"
# con show-details=never, así que estas probes no filtran detalle interno.
# NOTA: /actuator/health está detrás de anyRequest().authenticated() en
# SecurityConfig (devuelve 401 sin credenciales). Para que la plataforma pueda
# consultarlo por HTTP hay que, o bien usar un health check TCP/por puerto, o bien
# abrir /actuator/health/** con permitAll (ver READINESS.md, hallazgo IMPORTANTE).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# --- Errores hacia el cliente ------------------------------------------------
# Nada de stack traces ni mensajes internos en las respuestas de error. Son los
# defaults de Spring Boot; se dejan explícitos para que un cambio futuro no los
# afloje sin querer.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Logging estructurado a stdout -------------------------------------------
# JSON (Elastic Common Schema) a la salida estándar para que la plataforma lo
# recolecte e indexe. Se apaga el appender a archivo que se hereda de la base
# (logging.file.name vacío): en un contenedor el disco es efímero, escribir a
# logs/ no sirve para nada y solo llena disco.
logging.structured.format.console=ecs
logging.file.name=

# SQL logging apagado (ya viene de la base con show-sql=false); se reafirma que
# ni el SQL ni los parámetros (posible PII) terminen en los logs de producción.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web=INFO

# --- Sentry -------------------------------------------------------------------
# environment ya sale de SPRING_PROFILES_ACTIVE=prod (ver application.properties) y no
# hace falta pisarlo acá. Solo se ajusta la muestra de performance monitoring: 10% de
# las requests normales (los errores se capturan siempre, ver sentry.logging.* en la base).
sentry.traces-sample-rate=0.1

# --- ImageKit ----------------------------------------------------------------
# SIN default (a diferencia de la base): si falta la env var, la app NO arranca, en vez
# de quedar sirviendo un endpoint de subida que falla en cada request. Mismo criterio
# que DB_HOST/DB_NAME.
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
