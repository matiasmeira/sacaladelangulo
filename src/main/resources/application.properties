spring.application.name=sacaladelangulo
spring.config.import=optional:dotenv:

# DataSource configuration using environment variables from .env
# DB_USERNAME/DB_NAME no son secretos y mantienen defaults razonables para desarrollo local.
# DB_PASSWORD y JWT_SECRET NO tienen default: deben definirse en el .env o en el entorno,
# para evitar que la aplicación arranque en producción con credenciales conocidas/públicas.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sacaladelangulo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate por defecto (no auto-migra el esquema): sin Flyway/Liquibase en el proyecto
# todavía, dejar "update" como default de la config base es peligroso si algún día se
# corre sin el perfil "dev" activo (auto-migración silenciosa contra una base real). El
# perfil "dev" lo sobreescribe a "update" para desarrollo local (ver application-dev.properties).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT settings can also be loaded from environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
# Sesión de empleado de mostrador: vida corta e independiente de la sesión normal
jwt.empleado-expiration-millis=${JWT_EMPLEADO_EXPIRATION_MILLIS:3600000}

# URL base del frontend, usada para armar links de verificación (ej. registro en 2 pasos)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# CONFIGURACIÓN DE LOGS
# ===============================
# Nivel de detalle para tu código (INFO, DEBUG, ERROR)
logging.level.com.matiasmeira.sacaladelangulo=INFO

# Archivo de salida
logging.file.name=logs/sacaladelangulo.log

# Rotación del archivo para que no explote el disco del servidor
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# El logging DEBUG de Spring MVC (detalle de cada request/mapeo de handlers, con riesgo de
# filtrar headers/tokens a disco) vive solo en el perfil "dev" (ver application-dev.properties),
# nunca en la config base: si no se activa ningún perfil (ej. un despliegue real que se
# olvidó de fijar SPRING_PROFILES_ACTIVE), el comportamiento por defecto es el seguro.
