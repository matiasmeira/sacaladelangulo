spring.application.name=sacaladelangulo
spring.config.import=optional:dotenv:

# DataSource configuration using environment variables from .env
# DB_USERNAME/DB_NAME no son secretos y mantienen defaults razonables para desarrollo local.
# DB_PASSWORD y JWT_SECRET NO tienen default: deben definirse en el .env o en el entorno,
# para evitar que la aplicación arranque en producción con credenciales conocidas/públicas.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sacaladelangulo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate por defecto (no auto-migra el esquema): sin Flyway/Liquibase en el proyecto
# todavía, dejar "update" como default de la config base es peligroso si algún día se
# corre sin el perfil "dev" activo (auto-migración silenciosa contra una base real). El
# perfil "dev" lo sobreescribe a "update" para desarrollo local (ver application-dev.properties).
spring.jpa.hibernate.ddl-auto=validate
# show-sql/format_sql solo en el perfil "dev" (ver application-dev.properties): en
# producción es overhead de logging y ruido innecesario en los archivos de log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# open-in-view apagado (el default de Spring Boot es true, y emite un WARN al arrancar
# pidiendo que se defina explícitamente). Con true, la sesión de Hibernate queda abierta
# durante toda la request -- incluida la serialización de la respuesta -- reteniendo una
# conexión del pool más tiempo del necesario. En prod el pool es de 5 conexiones
# (DB_POOL_MAX_SIZE), así que ese tiempo extra recorta el throughput antes de lo que
# sugiere el número de conexiones.
#
# El otro motivo, más importante: con true, un acceso lazy fuera de la transacción se
# resuelve igual "de casualidad" en la capa web y el N+1 queda escondido. Con false falla
# ruidosamente en desarrollo, que es donde se quiere descubrir.
#
# Requisito previo (ya cumplido): las consultas de listado de ReservaRepository traen
# jugador y cancha con @EntityGraph. Son las asociaciones que ReservaMapper dereferencia;
# sin ese fetch, apagar open-in-view convertiría el N+1 en LazyInitializationException.
spring.jpa.open-in-view=false

# Flyway gestiona el esquema (ver src/main/resources/db/migration/V1__baseline.sql).
# baseline-on-migrate+baseline-version=1 hacen que una base de dev/prod que ya existía
# antes de introducir Flyway (creada históricamente con ddl-auto=update) se marque como si
# ya estuviera en V1 la primera vez que Flyway corre contra ella, en vez de fallar porque
# las tablas ya existen o de intentar recrearlas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT settings can also be loaded from environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
# Sesión de empleado de mostrador: vida corta e independiente de la sesión normal.
# Default de 15 min (900000ms) para que el comportamiento "de fábrica" ya sea el corto
# documentado, sin depender de que cada entorno lo sobreescriba explícitamente.
jwt.empleado-expiration-millis=${JWT_EMPLEADO_EXPIRATION_MILLIS:900000}

# Dispositivo de caja emparejado: token opaco (no JWT, ver DispositivoCajaService) con
# vencimiento largo pero revocable. Default 90 días.
caja.dispositivo-expiration-millis=${CAJA_DISPOSITIVO_EXPIRATION_MILLIS:7776000000}
# TTL del código de emparejamiento de un solo uso. Default 10 min.
caja.codigo-emparejamiento-ttl-millis=${CAJA_CODIGO_TTL_MILLIS:600000}

# URL base del frontend, usada para armar links de verificación (ej. registro en 2 pasos)
# y el link de emparejamiento de caja.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Orígenes permitidos por CORS (separados por coma). Antes estaba hardcodeado en
# SecurityConfig; ahora se puede cambiar por entorno sin recompilar.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Remitente de los emails transaccionales. Default al sandbox de Resend para que funcione
# en desarrollo sin tener un dominio propio verificado.
app.mail.from=${MAIL_FROM:SacaLaDelAngulo <onboarding@resend.dev>}

# Cola de reintento de emails (ver EmailServiceConReintentos y EmailReintentoJob). Un
# envío que falla queda encolado en emails_pendientes en vez de perderse; el job lo
# reintenta hasta agotar los intentos, y ahí pasa a ERROR y se loguea en nivel ERROR para
# que dispare una alerta. Defaults pensados para no castigar la cuota del proveedor: si
# está caído, 3 intentos espaciados 5 minutos cubren una caída corta sin insistir de más.
app.mail.reintento-intentos-maximos=${MAIL_REINTENTO_INTENTOS_MAXIMOS:3}
app.mail.reintento-intervalo-millis=${MAIL_REINTENTO_INTERVALO_MILLIS:300000}
# Delay inicial para no salir a reintentar en pleno arranque, compitiendo por el pool con
# las migraciones de Flyway y el warm-up del contexto.
app.mail.reintento-delay-inicial-millis=${MAIL_REINTENTO_DELAY_INICIAL_MILLIS:60000}
# Cuántos emails drena cada corrida. Acota el trabajo por tanda: si el proveedor estuvo
# caído un rato, la cola puede tener miles de filas y mandarlas todas de una bloquearía el
# hilo del scheduler.
app.mail.reintento-tamanio-lote=${MAIL_REINTENTO_TAMANIO_LOTE:50}

# Flag explícito (no secreto, default seguro "false") que decide entre LogEmailService
# (simula el envío) y ResendEmailService (envía de verdad). Es un flag propio en vez de
# activarse con la sola presencia de RESEND_API_KEY porque @ConditionalOnProperty sin
# "havingValue" matchea cualquier valor no-"false": mirar directamente la api-key hacía
# que, al setearla, quedaran los dos EmailService activos a la vez (bean ambiguo).
resend.enabled=${RESEND_ENABLED:false}

# Clave privada de ImageKit (alojamiento de fotos de establecimiento). Default VACÍO a
# propósito, y no ausente: los tests setean spring.config.import= y un placeholder sin
# default rompería el arranque de contexto de toda la suite. El SDK construye el cliente
# sin problema con una clave vacía (falla recién al llamar a la API), así que el default
# vacío degrada en dev sin romper nada. application-prod.properties lo pisa SIN default
# para que producción no arranque sin la clave real.
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}

# El default de Spring Boot es 1MB: sin esto un archivo de 5MB muere con
# MaxUploadSizeExceededException antes de llegar al controller. Se deja holgura sobre el
# límite de 5MB de ValidadorFoto para que el 400 lo produzca nuestra validación, con un
# mensaje claro, y no el contenedor.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Remitente reservado para emails de marketing (a diferencia de app.mail.from,
# transaccional). No usado activamente todavía; a escala, lo ideal es migrar
# los envíos masivos a Resend Broadcasts/Audiences en vez de este batching manual.
app.mail.marketing-from=${MARKETING_MAIL_FROM:${app.mail.from}}

# Degradación automática de plan al vencer la prueba gratuita (ver ExpiracionPruebaService):
# un OWNER que se queda en TRIAL después de fechaFinPrueba pasa a FREE. Cron diario en
# horario de baja carga (4am) para no competir con tráfico real; tamaño de lote acotado para
# no cargar toda la tabla de usuarios en memoria en una corrida con muchos vencidos.
app.suscripcion.expiracion-cron=${SUSCRIPCION_EXPIRACION_CRON:0 0 4 * * *}
app.suscripcion.expiracion-lote=${SUSCRIPCION_EXPIRACION_LOTE:100}

# RESEND_API_KEY y RESEND_WEBHOOK_SECRET son opcionales y, a propósito, no se declaran acá
# (a diferencia de JWT_SECRET/DB_PASSWORD, que sí son obligatorias): sin configurarlas, la
# app sigue funcionando con LogEmailService (simula el envío) y el endpoint de webhooks
# queda "cerrado" por defecto (ver ResendEmailService / ResendWebhookSignatureVerifier).
# Declarar acá un ${RESEND_API_KEY} sin default rompería el arranque en cualquier entorno
# donde todavía no se haya dado de alta una cuenta de Resend.

# Explícito en vez de depender del default implícito de Spring Boot (que hoy solo expone
# /actuator/health, pero no hay ninguna barrera que impida que un cambio futuro agregue
# management.endpoints.web.exposure.include=* y exponga /actuator/env, /actuator/heapdump,
# etc. sin querer). El resto de /actuator/** ya requiere autenticación por el
# anyRequest().authenticated() de SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# springdoc/Swagger apagado por defecto en la config base (misma filosofía que el resto
# de este archivo: el comportamiento "de fábrica", sin perfil activo, es el seguro para
# un despliegue real). El perfil "dev" lo reactiva (ver application-dev.properties) para
# tener la documentación interactiva en desarrollo. Apagarlo acá evita exponer el mapa
# completo de la API (endpoints, DTOs, parámetros) en producción. Las rutas /v3/api-docs/**
# y /swagger-ui/** siguen en el permitAll de SecurityConfig, pero con springdoc apagado
# simplemente no existen (devuelven 404), así que no hace falta tocar la config de seguridad.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Necesario para que una ruta inexistente dispare NoHandlerFoundException (y así pase por
# GlobalExceptionHandler con el formato de error del resto de la API) en vez del 404
# whitelabel por defecto de Spring Boot: sin esto, el resolver de recursos estáticos
# "atrapa" la request antes de que llegue a faltar un handler. (Desde Spring Framework 6.1,
# throwExceptionIfNoHandlerFound ya no hace falta configurarlo: es el comportamiento por
# defecto, y la property está deprecada.)
spring.web.resources.add-mappings=false

# ===============================
# CACHE
# ===============================
# Cache de la ficha publica de complejos (GET /api/v1/publico/complejos/{slug}).
# expireAfterWrite y no expireAfterAccess: la ventana tiene que contarse desde que el
# dato se leyo de la base, si no una ficha muy visitada renovaria su TTL en cada lectura
# y podria quedar desactualizada indefinidamente.
# maximumSize acota la memoria: son DTOs chicos, pero la clave es el slug y un scanner
# anonimo puede pedir muchos distintos.
spring.cache.cache-names=complejoDetalle
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

# ===============================
# CONFIGURACIÓN DE LOGS
# ===============================
# Nivel de detalle para tu código (INFO, DEBUG, ERROR)
logging.level.com.matiasmeira.sacaladelangulo=INFO

# Archivo de salida
logging.file.name=logs/sacaladelangulo.log

# Rotación del archivo para que no explote el disco del servidor
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# El logging DEBUG de Spring MVC (detalle de cada request/mapeo de handlers, con riesgo de
# filtrar headers/tokens a disco) vive solo en el perfil "dev" (ver application-dev.properties),
# nunca en la config base: si no se activa ningún perfil (ej. un despliegue real que se
# olvidó de fijar SPRING_PROFILES_ACTIVE), el comportamiento por defecto es el seguro.

# ===============================
# SENTRY (observabilidad de errores)
# ===============================
# Vacío por default: sin DSN el SDK queda deshabilitado (no-op) y el resto de la app
# sigue andando igual. Se define por env var, nunca hardcodeado (ver .env.example).
sentry.dsn=${SENTRY_DSN:}
# Mismo label que usa el resto del proyecto para distinguir entorno (dev/prod).
sentry.environment=${SPRING_PROFILES_ACTIVE:development}

# Solo ERROR se manda como Issue. Este proyecto tiene bastantes más sitios log.warn(...) que
# son condiciones de negocio esperadas (ej. GlobalExceptionHandler.handleDataIntegrityViolation
# logueando en warn el solapamiento de reservas ya comunicado como 409 al cliente) que
# log.error(...) que sí son bugs reales, incluido el catch-all de
# GlobalExceptionHandler.handleUnexpectedException. Mandar los warn como Issues quemaría la
# cuota gratuita (5000 eventos/mes) con ruido esperado.
sentry.logging.minimum-event-level=error
# Los warn SÍ quedan como breadcrumbs (contexto adjunto a un evento), sin generar un Issue propio.
sentry.logging.minimum-breadcrumb-level=warn

# Apagado en la config base: sin traces-sample-rate>0 no se manda performance data en
# dev/test. application-prod.properties lo prende con una muestra chica.
sentry.traces-sample-rate=0.0

# Default explícito (no hace falta activarlo): esta API maneja JWT, teléfonos y emails
# reales. send-default-pii=true adjuntaría IP, cookies y headers (incluido Authorization)
# a cada evento.
sentry.send-default-pii=false
