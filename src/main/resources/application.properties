spring.application.name=sacaladelangulo
spring.config.import=optional:dotenv:

# DataSource configuration using environment variables from .env
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sacaladelangulo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT settings can also be loaded from environment variables
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyForDevelopmentOnlyChangeThisSecretKey}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}

# JWT configuration
jwt.secret=ChangeThisSecretKeyForDevelopmentOnlyChangeThisSecretKey
jwt.expiration-millis=3600000
