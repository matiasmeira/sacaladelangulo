<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>¡Bienvenido a Canchear!</title>
</head>
<body>

<div th:replace="~{layout :: email(titulo='¡Bienvenido a Canchear!', contenidoHtml=~{::#contenido})}">

    <div id="contenido">
        <p style="margin:0 0 16px 0;">
            Hola <span th:text="${nombre}">Dueño</span>, ¡tu cuenta ya está lista!
        </p>
        <p style="margin:0 0 24px 0;">
            Ya podés cargar tu complejo: los datos, los horarios, las canchas y las tarifas.
            Cuando lo tengas listo, mandanos la solicitud de verificación desde la app.
        </p>
    </div>

</div>

</body>
</html>
