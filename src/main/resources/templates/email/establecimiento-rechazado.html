<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tu solicitud de verificación fue rechazada</title>
</head>
<body>

<div th:replace="~{layout :: email(titulo='Tu solicitud de verificación fue rechazada', contenidoHtml=~{::#contenido})}">

    <div id="contenido">
        <p style="margin:0 0 16px 0;">
            Hola <span th:text="${nombre}">Dueño</span>, revisamos la solicitud de verificación
            de <strong th:text="${nombreEstablecimiento}">Tu Complejo</strong> y no pudimos
            aprobarla todavía.
        </p>
        <p style="margin:0 0 8px 0;">
            <strong>Motivo:</strong>
        </p>
        <p style="margin:0 0 24px 0;padding:12px 16px;background-color:#f6f9fc;border-radius:8px;">
            <span th:text="${motivo}">Motivo del rechazo</span>
        </p>
        <p style="margin:0 0 24px 0;">
            Podés corregir los datos desde tu panel y volver a enviar la solicitud de
            verificación cuando quieras.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td style="border-radius:10px;background-color:#0e56c9;">
                    <a th:href="${ctaUrl}" href="#"
                       style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">
                        Ir a mi panel
                    </a>
                </td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
