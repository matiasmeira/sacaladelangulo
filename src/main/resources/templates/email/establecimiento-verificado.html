<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>¡Tu establecimiento fue verificado!</title>
</head>
<body>

<div th:replace="~{layout :: email(titulo='¡Tu establecimiento fue verificado!', contenidoHtml=~{::#contenido})}">

    <div id="contenido">
        <p style="margin:0 0 16px 0;">
            Hola <span th:text="${nombre}">Dueño</span>, revisamos tu solicitud y
            <strong th:text="${nombreEstablecimiento}">Tu Complejo</strong> ya está verificado.
        </p>
        <p style="margin:0 0 24px 0;">
            Tu complejo ya aparece en el buscador y los jugadores pueden reservar. Aprovechamos
            para arrancar tu mes de prueba gratuita de Canchear.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td style="border-radius:10px;background-color:#0e56c9;">
                    <a th:href="${ctaUrl}" href="#"
                       style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">
                        Ir a mi panel
                    </a>
                </td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
