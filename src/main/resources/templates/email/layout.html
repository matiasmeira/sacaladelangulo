<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Saque</title>
</head>
<body>

<!--
  Layout reutilizable para todos los emails transaccionales (Fases 0-6). Expone un único
  fragmento flexible, "email(titulo, contenidoHtml)", que recibe un título y un bloque de
  contenido HTML ya armado por la plantilla que lo llama (ej. verificacion.html): así el
  layout no necesita conocer de antemano la forma de cada email (texto simple, CTA, tabla
  de detalles de reserva, código de 6 dígitos, etc.), y cada plantilla concreta arma su
  propio contenido con los estilos inline que necesite.
-->
<div th:fragment="email(titulo, contenidoHtml)" th:remove="tag">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="width:100%;background-color:#f6f9fc;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                       style="width:600px;max-width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="background-color:#ffffff;padding:28px 40px;border-bottom:1px solid #eef1f6;">
                            <span style="font-size:22px;font-weight:700;color:#0a1f3d;letter-spacing:-0.02em;">Saque</span>
                        </td>
                    </tr>
                    <!-- Título + contenido -->
                    <tr>
                        <td style="padding:40px;color:#0a1f3d;">
                            <h1 th:text="${titulo}"
                                style="margin:0 0 16px 0;font-size:20px;line-height:1.3;color:#0a1f3d;font-weight:700;">
                                Título
                            </h1>
                            <div th:insert="${contenidoHtml}"
                                 style="font-size:15px;line-height:1.6;color:#0a1f3d;">
                                Contenido
                            </div>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding:24px 40px;border-top:1px solid #eef1f6;">
                            <p style="margin:0;font-size:12px;line-height:1.5;color:#8a94a6;">
                                Este es un email transaccional relacionado con tu cuenta de Saque.
                                Si no reconocés esta actividad, podés ignorar este mensaje.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
