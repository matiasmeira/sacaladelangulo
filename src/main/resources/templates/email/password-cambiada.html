<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tu contraseña fue cambiada</title>
</head>
<body>

<div th:replace="~{layout :: email(titulo='Tu contraseña fue cambiada', contenidoHtml=~{::#contenido})}">

    <div id="contenido">
        <p style="margin:0 0 16px 0;">
            La contraseña de tu cuenta de Canchear acaba de ser cambiada.
        </p>
        <p style="margin:0;">
            Si fuiste vos, no necesitás hacer nada más. Si no fuiste vos, contactanos lo
            antes posible para asegurar tu cuenta.
        </p>
    </div>

</div>

</body>
</html>
