<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuevo turno fijo en tu establecimiento</title>
</head>
<body>

<!--
  Contracara de turno-fijo-confirmado.html para el dueño: un solo aviso con todas las
  fechas, en vez de uno por ocurrencia (ver TurnoFijoCreadoEvent).
-->
<div th:replace="~{layout :: email(titulo='Nuevo turno fijo en tu establecimiento', contenidoHtml=~{::#contenido})}">

    <div id="contenido">
        <p style="margin:0 0 24px 0;">
            Se cargó un turno fijo semanal en tu establecimiento, con
            <strong th:text="${cantidadTurnos}">0</strong> fechas confirmadas:
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="width:100%;border-collapse:collapse;">
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;border-bottom:1px solid #eef1f6;">Cliente</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;border-bottom:1px solid #eef1f6;" th:text="${nombreCliente}">Cliente</td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;border-bottom:1px solid #eef1f6;">Establecimiento</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;border-bottom:1px solid #eef1f6;" th:text="${establecimientoNombre}">Establecimiento</td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;border-bottom:1px solid #eef1f6;">Cancha</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;border-bottom:1px solid #eef1f6;" th:text="${canchaNombre}">Cancha</td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;border-bottom:1px solid #eef1f6;">Deporte</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;border-bottom:1px solid #eef1f6;" th:text="${deporte}">Deporte</td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;border-bottom:1px solid #eef1f6;">Horario</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;border-bottom:1px solid #eef1f6;">
                    <span th:text="${horaInicio}">00:00</span> - <span th:text="${horaFin}">00:00</span>
                </td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;border-bottom:1px solid #eef1f6;">Precio por turno</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;border-bottom:1px solid #eef1f6;" th:text="${'$' + precioPorTurno}">$0</td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-size:13px;color:#5b6472;">Total del período</td>
                <td style="padding:10px 0;font-size:14px;color:#0a1f3d;font-weight:600;text-align:right;" th:text="${'$' + precioTotalTurnoFijo}">$0</td>
            </tr>
        </table>

        <p style="margin:28px 0 12px 0;font-size:13px;font-weight:700;color:#0a1f3d;">
            Fechas ocupadas
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="width:100%;border-collapse:collapse;">
            <tr th:each="fecha : ${fechas}">
                <td style="padding:8px 0;font-size:14px;color:#0a1f3d;border-bottom:1px solid #eef1f6;"
                    th:text="${fecha}">00/00/0000</td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
